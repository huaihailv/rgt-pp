<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1100" role="img"><title>QwenRGT 对齐的输入输出与 Attention Mask</title><rect width="1240" height="1100" rx="16" fill="#f6f5ef" /><g font-family="system-ui,sans-serif" fill="#19362f"><text x="620" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#19362f">QwenRGT · SEQUENCE FORWARD</text><text x="170" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#326d68">共享条件 C</text><text x="170" y="135" text-anchor="middle" font-size="15" font-weight="400" fill="#326d68">无独立输出 / loss</text><rect x="335" y="70" width="270" height="90" rx="9" fill="#4c722d" stroke="#4c722d" /><text x="470" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">连续动作 H × D</text><text x="470" y="136" text-anchor="middle" font-size="16" font-weight="400" fill="#ffffff">动作 L1</text><polygon points="470,174 483,186 475,186 475,205 465,205 465,186 457,186" fill="#718967" /><rect x="635" y="70" width="270" height="90" rx="9" fill="#895c25" stroke="#895c25" /><text x="770" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">VV 变化描述</text><text x="770" y="136" text-anchor="middle" font-size="16" font-weight="400" fill="#ffffff">VV 文本 CE</text><polygon points="770,174 783,186 775,186 775,205 765,205 765,186 757,186" fill="#718967" /><rect x="935" y="70" width="270" height="90" rx="9" fill="#70518e" stroke="#70518e" /><text x="1070" y="105" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">VA 动作效果描述</text><text x="1070" y="136" text-anchor="middle" font-size="16" font-weight="400" fill="#ffffff">VA 文本 CE</text><polygon points="1070,174 1083,186 1075,186 1075,205 1065,205 1065,186 1057,186" fill="#718967" /><rect x="30" y="220" width="1180" height="290" rx="9" fill="#e6ebdf" stroke="#bdcbb6" /><text x="620" y="264" text-anchor="middle" font-size="30" font-weight="700" fill="#19362f">Any VLM</text><text x="620" y="296" text-anchor="middle" font-size="17" font-weight="400" fill="#19362f">每层计算一次 C；后缀分别读取 C K/V，M / V / A 互不可见</text><rect x="35" y="325" width="270" height="150" rx="9" fill="#bcdad7" stroke="#bdcbb6" /><text x="170" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#19362f">共享前缀 C</text><text x="170" y="391" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">当前图像 + 语言</text><text x="170" y="418" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">产生本层 C K/V</text><text x="170" y="445" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">供三个分支读取</text><rect x="335" y="325" width="270" height="150" rx="9" fill="#c5ed75" stroke="#bdcbb6" /><text x="470" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#19362f">OFT 动作模块</text><text x="470" y="391" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">H 个 query hidden</text><text x="470" y="418" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">action head → H × D</text><text x="470" y="445" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">连续回归，非 diffusion/FM</text><rect x="635" y="325" width="270" height="150" rx="9" fill="#f1d5a3" stroke="#bdcbb6" /><text x="770" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#19362f">V 分支 / LM head</text><text x="770" y="391" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">未来图 + 回答历史</text><text x="770" y="418" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">读取 C + V 因果历史</text><text x="770" y="445" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">预测下一回答 token</text><rect x="935" y="325" width="270" height="150" rx="9" fill="#d9c9ed" stroke="#bdcbb6" /><text x="1070" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#19362f">A 分支 / LM head</text><text x="1070" y="391" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">真实动作 + 回答历史</text><text x="1070" y="418" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">读取 C + A 因果历史</text><text x="1070" y="445" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">预测下一回答 token</text><text x="620" y="496" text-anchor="middle" font-size="13" font-weight="400" fill="#64736c">框内为功能路径示意；action head / LM head 是输出读出</text><polygon points="170,520 183,532 175,532 175,543 165,543 165,532 157,532" fill="#718967" /><text x="170" y="570" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">C · 当前图像 + 语言</text><rect x="38" y="589" width="49" height="52" rx="9" fill="#e0efed" stroke="#bdcbb6" /><text x="62.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">图</text><rect x="92" y="589" width="49" height="52" rx="9" fill="#e0efed" stroke="#bdcbb6" /><text x="116.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">图</text><rect x="146" y="589" width="49" height="52" rx="9" fill="#e0efed" stroke="#bdcbb6" /><text x="170.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">L</text><rect x="200" y="589" width="49" height="52" rx="9" fill="#e0efed" stroke="#bdcbb6" /><text x="224.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">L</text><rect x="254" y="589" width="49" height="52" rx="9" fill="#e0efed" stroke="#bdcbb6" /><text x="278.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">…</text><polygon points="470,520 483,532 475,532 475,543 465,543 465,532 457,532" fill="#718967" /><text x="470" y="570" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">M · OFT queries</text><rect x="338" y="589" width="49" height="52" rx="9" fill="#e7f4cd" stroke="#bdcbb6" /><text x="362.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">q₁</text><rect x="392" y="589" width="49" height="52" rx="9" fill="#e7f4cd" stroke="#bdcbb6" /><text x="416.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">q₂</text><rect x="446" y="589" width="49" height="52" rx="9" fill="#e7f4cd" stroke="#bdcbb6" /><text x="470.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">q₃</text><rect x="500" y="589" width="49" height="52" rx="9" fill="#e7f4cd" stroke="#bdcbb6" /><text x="524.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">…</text><rect x="554" y="589" width="49" height="52" rx="9" fill="#e7f4cd" stroke="#bdcbb6" /><text x="578.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">qH</text><polygon points="770,520 783,532 775,532 775,543 765,543 765,532 757,532" fill="#718967" /><text x="770" y="570" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">V · 未来图 + Y 前缀</text><rect x="638" y="589" width="49" height="52" rx="9" fill="#faf0db" stroke="#bdcbb6" /><text x="662.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">图′</text><rect x="692" y="589" width="49" height="52" rx="9" fill="#faf0db" stroke="#bdcbb6" /><text x="716.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">图′</text><rect x="746" y="589" width="49" height="52" rx="9" fill="#faf0db" stroke="#bdcbb6" /><text x="770.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">Y₀</text><rect x="800" y="589" width="49" height="52" rx="9" fill="#faf0db" stroke="#bdcbb6" /><text x="824.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">Y₁</text><rect x="854" y="589" width="49" height="52" rx="9" fill="#faf0db" stroke="#bdcbb6" /><text x="878.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">…</text><polygon points="1070,520 1083,532 1075,532 1075,543 1065,543 1065,532 1057,532" fill="#718967" /><text x="1070" y="570" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">A · 动作 + Y 前缀</text><rect x="938" y="589" width="49" height="52" rx="9" fill="#eee6f8" stroke="#bdcbb6" /><text x="962.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">a₁</text><rect x="992" y="589" width="49" height="52" rx="9" fill="#eee6f8" stroke="#bdcbb6" /><text x="1016.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">a₂</text><rect x="1046" y="589" width="49" height="52" rx="9" fill="#eee6f8" stroke="#bdcbb6" /><text x="1070.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">…</text><rect x="1100" y="589" width="49" height="52" rx="9" fill="#eee6f8" stroke="#bdcbb6" /><text x="1124.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">Y₀</text><rect x="1154" y="589" width="49" height="52" rx="9" fill="#eee6f8" stroke="#bdcbb6" /><text x="1178.5" y="622" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">…</text><text x="620" y="675" text-anchor="middle" font-size="19" font-weight="700" fill="#19362f">输入 [ C | M | V | A ]：列位置对应；拼接顺序不代表全局可见</text><rect x="30" y="705" width="1180" height="365" rx="9" fill="#fffef9" stroke="#bdcbb6" /><text x="300" y="745" text-anchor="middle" font-size="22" font-weight="700" fill="#19362f">ATTENTION MASK</text><text x="300" y="772" text-anchor="middle" font-size="15" font-weight="400" fill="#19362f">行 = Query（谁读）｜列 = Key（读谁）</text><text x="200" y="800" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">C</text><text x="270" y="800" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">M</text><text x="340" y="800" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">V</text><text x="410" y="800" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">A</text><text x="135" y="842" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">C</text><rect x="170" y="813" width="62" height="40" rx="9" fill="#bcdad7" stroke="#bdcbb6" /><text x="201" y="839" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">因果</text><rect x="240" y="813" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="271" y="839" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><rect x="310" y="813" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="341" y="839" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><rect x="380" y="813" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="411" y="839" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><text x="135" y="890" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">M</text><rect x="170" y="861" width="62" height="40" rx="9" fill="#d9e9cc" stroke="#bdcbb6" /><text x="201" y="887" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">可见</text><rect x="240" y="861" width="62" height="40" rx="9" fill="#c5ed75" stroke="#bdcbb6" /><text x="271" y="887" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">因果</text><rect x="310" y="861" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="341" y="887" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><rect x="380" y="861" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="411" y="887" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><text x="135" y="938" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">V</text><rect x="170" y="909" width="62" height="40" rx="9" fill="#d9e9cc" stroke="#bdcbb6" /><text x="201" y="935" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">可见</text><rect x="240" y="909" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="271" y="935" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><rect x="310" y="909" width="62" height="40" rx="9" fill="#f1d5a3" stroke="#bdcbb6" /><text x="341" y="935" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">因果</text><rect x="380" y="909" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="411" y="935" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><text x="135" y="986" text-anchor="middle" font-size="18" font-weight="700" fill="#19362f">A</text><rect x="170" y="957" width="62" height="40" rx="9" fill="#d9e9cc" stroke="#bdcbb6" /><text x="201" y="983" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">可见</text><rect x="240" y="957" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="271" y="983" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><rect x="310" y="957" width="62" height="40" rx="9" fill="#eceee9" stroke="#bdcbb6" /><text x="341" y="983" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">禁止</text><rect x="380" y="957" width="62" height="40" rx="9" fill="#d9c9ed" stroke="#bdcbb6" /><text x="411" y="983" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">因果</text><text x="300" y="1038" text-anchor="middle" font-size="14" font-weight="400" fill="#64736c">因果：只能读本段当前位置及之前</text><text x="810" y="795" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">共同规则</text><text x="810" y="818" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">每个后缀可以读全部 C；C 不能读任何后缀。</text><text x="810" y="846" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">分支隔离</text><text x="810" y="869" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">M 不能看 V/A；V 与 A 也不能互看或读取 M。</text><text x="810" y="897" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">训练监督</text><text x="810" y="920" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">Y 为 teacher forcing 的历史；不能偷看后续答案。</text><text x="810" y="948" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">动作推理</text><text x="810" y="971" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">只运行 C + M；无未来图、真实动作或 VV/VA 答案。</text><text x="810" y="999" text-anchor="middle" font-size="17" font-weight="700" fill="#19362f">实现范围</text><text x="810" y="1022" text-anchor="middle" font-size="14" font-weight="400" fill="#19362f">对应 integrations/oft_sequence_vv_va 的 sequence 版本。</text></g></svg>