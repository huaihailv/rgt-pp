<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img"><title>信息使用：红杯子指令下替换蓝杯子语义（示意，非实测）</title><rect x="0" y="0" width="360" height="320" rx="10" fill="#f6f5ef"/><g font-family="system-ui,sans-serif"><text x="18" y="23" font-size="11" fill="#64736c" text-anchor="start" font-weight="400">输出示例 · 示意，非实测</text><rect x="18" y="36" width="324" height="30" rx="4" fill="#e5efeb"/><text x="180" y="56" font-size="13" fill="#326d68" text-anchor="middle" font-weight="700">共同指令：拿红杯子</text><text x="180" y="88" font-size="11" fill="#19362f" text-anchor="middle" font-weight="400">换入“蓝杯子”表示，动作会转向吗？</text><rect x="18" y="117" width="70" height="38" rx="4" fill="#bcdad7"/><text x="53" y="141" font-size="11" fill="#326d68" text-anchor="middle" font-weight="400">语义替换</text><rect x="99" y="117" width="35" height="38" rx="4" fill="#e4eed5"/><rect x="138" y="117" width="35" height="38" rx="4" fill="#d5e9b4"/><rect x="177" y="117" width="35" height="38" rx="4" fill="#b7d784"/><rect x="216" y="117" width="35" height="38" rx="4" fill="#7fa54c"/><rect x="255" y="117" width="35" height="38" rx="4" fill="#4c722d"/><rect x="294" y="117" width="35" height="38" rx="4" fill="#71963f"/><rect x="18" y="164" width="70" height="38" rx="4" fill="#bcdad7"/><text x="53" y="188" font-size="11" fill="#326d68" text-anchor="middle" font-weight="400">随机替换</text><rect x="99" y="164" width="35" height="38" rx="4" fill="#edf1e8"/><rect x="138" y="164" width="35" height="38" rx="4" fill="#e7eedc"/><rect x="177" y="164" width="35" height="38" rx="4" fill="#e1ebd2"/><rect x="216" y="164" width="35" height="38" rx="4" fill="#e7eedc"/><rect x="255" y="164" width="35" height="38" rx="4" fill="#e1ebd2"/><rect x="294" y="164" width="35" height="38" rx="4" fill="#e7eedc"/><text x="99" y="220" font-size="10" fill="#64736c" text-anchor="start" font-weight="400">浅层</text><text x="329" y="220" font-size="10" fill="#64736c" text-anchor="end" font-weight="400">深层</text><text x="214" y="220" font-size="10" fill="#64736c" text-anchor="middle" font-weight="400">被干预的层 →</text><defs><linearGradient id="effect"><stop stop-color="#edf1e8"/><stop offset="1" stop-color="#4c722d"/></linearGradient></defs><text x="52" y="246" font-size="10" fill="#64736c" text-anchor="start" font-weight="400">弱</text><rect x="75" y="237" width="210" height="9" rx="4" fill="url(#effect)"/><text x="299" y="246" font-size="10" fill="#64736c" text-anchor="start" font-weight="400">强</text><text x="180" y="266" font-size="10" fill="#4c722d" text-anchor="middle" font-weight="400">颜色 = 向“拿蓝杯子”参考动作偏移</text><text x="180" y="281" font-size="10" fill="#64736c" text-anchor="middle" font-weight="400">非输出概率；关键层再检查执行目标</text><text x="180" y="302" font-size="11" fill="#326d68" text-anchor="middle" font-weight="700">有对照的目标切换 → 更强因果证据</text></g></svg>