<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img"><title>信息关注：拿红杯子时动作关注哪里（示意，非实测）</title><rect x="0" y="0" width="360" height="320" rx="10" fill="#f6f5ef"/><g font-family="system-ui,sans-serif"><text x="18" y="23" font-size="11" fill="#64736c" text-anchor="start" font-weight="400">输出示例 · 示意，非实测</text><rect x="18" y="36" width="324" height="30" rx="4" fill="#e5efeb"/><text x="180" y="56" font-size="13" fill="#326d68" text-anchor="middle" font-weight="700">共同指令：拿红杯子</text><text x="180" y="88" font-size="11" fill="#64736c" text-anchor="middle" font-weight="400">动作 query → 图像区域 / 指令词</text><text x="110" y="113" font-size="10" fill="#326d68" text-anchor="middle" font-weight="400">红杯图</text><text x="159" y="113" font-size="10" fill="#326d68" text-anchor="middle" font-weight="400">蓝杯图</text><text x="208" y="113" font-size="10" fill="#326d68" text-anchor="middle" font-weight="400">背景</text><text x="257" y="113" font-size="10" fill="#326d68" text-anchor="middle" font-weight="400">“红”</text><text x="306" y="113" font-size="10" fill="#326d68" text-anchor="middle" font-weight="400">“杯子”</text><rect x="18" y="124" width="61" height="29" rx="4" fill="#c5ed75"/><text x="48" y="143" font-size="11" fill="#4c722d" text-anchor="middle" font-weight="700">M · q1</text><rect x="88" y="124" width="44" height="29" rx="4" fill="#326d68"/><rect x="137" y="124" width="44" height="29" rx="4" fill="#d1e4df"/><rect x="186" y="124" width="44" height="29" rx="4" fill="#e7efeb"/><rect x="235" y="124" width="44" height="29" rx="4" fill="#4d8880"/><rect x="284" y="124" width="44" height="29" rx="4" fill="#80aaa3"/><rect x="18" y="159" width="61" height="29" rx="4" fill="#c5ed75"/><text x="48" y="178" font-size="11" fill="#4c722d" text-anchor="middle" font-weight="700">M · q2</text><rect x="88" y="159" width="44" height="29" rx="4" fill="#528c84"/><rect x="137" y="159" width="44" height="29" rx="4" fill="#dce9e4"/><rect x="186" y="159" width="44" height="29" rx="4" fill="#e7efeb"/><rect x="235" y="159" width="44" height="29" rx="4" fill="#326d68"/><rect x="284" y="159" width="44" height="29" rx="4" fill="#64988f"/><rect x="18" y="194" width="61" height="29" rx="4" fill="#c5ed75"/><text x="48" y="213" font-size="11" fill="#4c722d" text-anchor="middle" font-weight="700">M · q3</text><rect x="88" y="194" width="44" height="29" rx="4" fill="#3d7971"/><rect x="137" y="194" width="44" height="29" rx="4" fill="#d1e4df"/><rect x="186" y="194" width="44" height="29" rx="4" fill="#e7efeb"/><rect x="235" y="194" width="44" height="29" rx="4" fill="#75a49a"/><rect x="284" y="194" width="44" height="29" rx="4" fill="#528c84"/><text x="180" y="251" font-size="11" fill="#64736c" text-anchor="middle" font-weight="400">深色 = 更多注意力落在该位置</text><text x="180" y="277" font-size="10" fill="#64736c" text-anchor="middle" font-weight="400">只展示允许的 M → C 注意力</text><text x="180" y="302" font-size="11" fill="#326d68" text-anchor="middle" font-weight="700">关注红杯子 ≠ 动作一定使用它</text></g></svg>