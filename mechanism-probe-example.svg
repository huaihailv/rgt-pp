<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img"><title>信息编码：从动作表示能否读出红杯子（示意，非实测）</title><rect x="0" y="0" width="360" height="320" rx="10" fill="#f6f5ef"/><g font-family="system-ui,sans-serif"><text x="18" y="23" font-size="11" fill="#64736c" text-anchor="start" font-weight="400">输出示例 · 示意，非实测</text><rect x="18" y="36" width="324" height="30" rx="4" fill="#e5efeb"/><text x="180" y="56" font-size="13" fill="#326d68" text-anchor="middle" font-weight="700">共同指令：拿红杯子</text><text x="24" y="88" font-size="11" fill="#19362f" text-anchor="start" font-weight="400">“红色 / 杯子”标签可读出程度</text><rect x="232" y="77" width="10" height="10" rx="4" fill="#326d68"/><text x="247" y="87" font-size="11" fill="#326d68" text-anchor="start" font-weight="400">C</text><rect x="278" y="77" width="10" height="10" rx="4" fill="#4c722d"/><text x="293" y="87" font-size="11" fill="#4c722d" text-anchor="start" font-weight="400">M</text><path d="M44 102V242H330" fill="none" stroke="#afbdad"/><path d="M44 132H330 M44 183H330" stroke="#dce3d6" stroke-dasharray="3 5"/><text x="32" y="115" font-size="10" fill="#64736c" text-anchor="end" font-weight="400">高</text><text x="32" y="240" font-size="10" fill="#64736c" text-anchor="end" font-weight="400">低</text><text x="44" y="260" font-size="10" fill="#64736c" text-anchor="start" font-weight="400">浅层</text><text x="330" y="260" font-size="10" fill="#64736c" text-anchor="end" font-weight="400">深层</text><path d="M50 221 C95 213 109 152 151 133 S250 119 322 117" fill="none" stroke="#326d68" stroke-width="3.5"/><path d="M50 230 C112 230 145 211 182 179 S257 150 322 143" fill="none" stroke="#4c722d" stroke-width="3.5" stroke-dasharray="6 4"/><text x="180" y="280" font-size="10" fill="#64736c" text-anchor="middle" font-weight="400">冻结模型 · 线性探针 · 留出样本准确率</text><text x="180" y="302" font-size="11" fill="#326d68" text-anchor="middle" font-weight="700">能读出“红杯子” ≠ 动作依赖它</text></g></svg>